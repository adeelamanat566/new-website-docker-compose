services:

  mysql-test:
    image: mysql:8.4
    container_name: grocery-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grocery_db
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  flask-test:
    build: .
    container_name: grocery-test
    environment:
      MYSQL_HOST: mysql-test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: grocery_db
    ports:
      - "8081:5000"
    depends_on:
      - mysql-test
