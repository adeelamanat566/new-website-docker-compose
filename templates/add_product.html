<!DOCTYPE html>
<html>
<head><title>Add Product</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav><h2>Grocery Store</h2><a href="/">Products</a><a href="/customers">Customers</a><a href="/orders">Orders</a></nav>
<div class="container">
<h1>Add Product</h1>
<form method="POST" class="form">
<input name="name" placeholder="Product name" required>
<input name="price" type="number" step="0.01" placeholder="Price" required>
<input name="stock" type="number" placeholder="Stock" required>
<select name="category_id" required>
{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
</select>
<button>Add Product</button>
</form>
</div>
</body>
</html>
