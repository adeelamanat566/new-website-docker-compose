services:
  mysql-prod:
    image: mysql:8.4
    container_name: grocery-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: adeel
      MYSQL_DATABASE: grocery_db
    ports:
      - "3306:3306"

  flask-prod:
    build: .
    container_name: grocery-prod
    environment:
      MYSQL_HOST: mysql-prod
      MYSQL_USER: root
      MYSQL_PASSWORD: adeel
      MYSQL_DATABASE: grocery_db
    ports:
      - "5000:5000"
    depends_on:
      - mysql-prod
