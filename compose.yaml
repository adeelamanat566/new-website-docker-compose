services:
  sql:
    container_name: mysql
    image: mysql:8.4
    ports: 
      - "3306:3306"
    environment:  
      - MYSQL_ROOT_PASSWORD:adeel
      - MYSQL_DATABASE:grocery_db
    
    volumes:
      - "mysql-data:/var/lib/mysql"
      - "./database/init.sql:/docker-entrypoint-initdb.d/init.sql"

          
  flask :  
    container_name: ali  
    build: 
      context: .
    ports:
      - "5000:5000" 
    environment: 
      - MYSQL_HOST:mysql
      - MYSQL_USER:root 
      - MYSQL_PASSWORD=adeel
      - MYSQL_DATABASE:grocery_db


volumes:
  mysql-data: 