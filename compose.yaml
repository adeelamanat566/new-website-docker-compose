
services:

  sql:
    image: mysql:8.4
    container_name: sql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grocery_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  grocery:
    build: .
    container_name: grocery
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: sql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: grocery_db
    depends_on:
      sql:
        condition: service_healthy

volumes:
  mysql_data:

